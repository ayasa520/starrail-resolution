plugins { id 'com.android.application' }
android {
    namespace 'io.rikka.starrailresolution'
    compileSdk 36
    defaultConfig {
        applicationId 'io.rikka.starrailresolution'
        minSdk 30
        targetSdk 36
        versionCode 6
        versionName '1.5.0'
        testInstrumentationRunner 'io.rikka.starrailresolution.ShizukuIntegrationTest'
    }
    buildFeatures { aidl true }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = false }
}
dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    compileOnly 'androidx.annotation:annotation:1.9.1'
    androidTestCompileOnly 'androidx.annotation:annotation:1.9.1'
    testImplementation 'junit:junit:4.13.2'
}
